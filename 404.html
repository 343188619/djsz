<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title data-i18n="page_title">核验失败 | 身份核验系统</title>
    
    <link rel="icon" href="https://default-uqewhjj.cdn.7caiyun.com/%E5%9E%AB%E6%B1%9F%E5%8D%81%E4%B8%AD%E5%AD%A6%E7%94%9F%E6%96%B0%E5%AA%92%E4%BD%93%E4%B8%AD%E5%BF%83%202.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        :root {
            --bg-light: #F7F7F7; --text-light: #111111; --bg-dark: #0A0A0A; --text-dark: #F2F2F2;
            --gold: #B89C5D; --error-red: #8B0000;
            --font-serif: 'Noto Serif SC', serif; --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: var(--font-sans); 
            background-color: var(--bg-light); 
            color: var(--text-light); 
            transition: 0.8s ease; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        [data-theme="dark"] body { background-color: var(--bg-dark); color: var(--text-dark); }

        /* 警示装饰背景 */
        .error-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(139, 0, 0, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 0 5vw;
            max-width: 700px;
        }

        /* 警示图标 */
        .icon-wrap {
            font-size: 5rem;
            color: var(--gold);
            margin-bottom: 2rem;
            animation: pulseWarning 2s infinite;
        }
        @keyframes pulseWarning {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .error-box {
            border-top: 1px solid rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 2.5rem 0;
            margin-bottom: 3rem;
        }
        [data-theme="dark"] .error-box { border-color: rgba(255,255,255,0.1); }

        .error-box p {
            font-size: 1.1rem;
            line-height: 2;
            color: #666;
            font-family: var(--font-serif);
            text-align: justify;
        }
        [data-theme="dark"] .error-box p { color: #aaa; }

        .warning-text {
            color: var(--error-red);
            font-weight: 600;
            display: block;
            margin-top: 1rem;
            letter-spacing: 0.1em;
        }

        /* 重新查询按钮 */
        .btn-retry {
            display: inline-block;
            padding: 15px 50px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: all 0.5s;
            position: relative;
            background: transparent;
        }
        .btn-retry:hover {
            background: var(--gold);
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(184, 156, 93, 0.2);
        }

        .home-link {
            display: block;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #999;
            text-decoration: none;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }
        .home-link:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="error-bg"></div>

    <div class="container" data-aos="fade-up">
        <div class="icon-wrap">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1 data-i18n="err_title">核验结果：无效编号</h1>
        
        <div class="error-box">
            <p data-i18n="err_desc">
                系统未能检索到您输入的编号。该编号可能输入有误，或者该证件为非官方授权的伪造凭证。为了维护中心信誉，任何非官方录入的身份信息均视为无效。
            </p>
            <span class="warning-text" data-i18n="warning">疑似伪造凭证 / SUSPECTED FORGERY</span>
        </div>

        <a href="cx.html" class="btn-retry" data-i18n="btn_retry">重新核验 / RE-QUERY</a>
        
        <a href="index.html" class="home-link" data-i18n="go_home">返回官网首页 / BACK TO HOME</a>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });

        const i18n = {
            zh: {
                page_title: "核验失败 | 身份核验系统",
                err_title: "核验结果：无效编号",
                err_desc: "系统未能检索到您输入的编号。该编号可能输入有误，或者该证件为非官方授权的伪造凭证。为了维护中心信誉，任何非官方录入的身份信息均视为无效。",
                warning: "疑似伪造凭证 / SUSPECTED FORGERY",
                btn_retry: "重新核验 / RE-QUERY",
                go_home: "返回官网首页"
            },
            en: {
                page_title: "Verification Failed | SMC System",
                err_title: "RESULT: INVALID ID",
                err_desc: "The system could not retrieve the ID you entered. This ID may have been entered incorrectly, or the credential is an unauthorized forgery. For institutional integrity, all unofficial entries are deemed invalid.",
                warning: "SUSPECTED FORGERY",
                btn_retry: "RE-QUERY",
                go_home: "BACK TO HOME"
            }
        };

        // 自动识别语言（如有主页逻辑可接入）
        let currentLang = 'zh'; 
        // 简单的深色模式检查
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
