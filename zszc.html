<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>威斯特礼国际学院 · 招生申请</title>
  <!-- 字体与基础库 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#001744',
            gold: '#C5A059',
            goldHover: '#d4b272'
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['Lato', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Lato', sans-serif;
      background: #f8f9fa;
    }
    h1, h2, h3, .font-serif {
      font-family: '"Noto Serif SC"', serif;
    }
    .card-shadow {
      box-shadow: 0 20px 35px -8px rgba(0,23,68,0.12), 0 10px 15px -6px rgba(0,23,68,0.05);
    }
    .gold-bottom-line {
      background: linear-gradient(to right, #C5A059, #f1d28c, #C5A059);
      height: 2px;
      width: 80px;
      margin: 1rem auto 1.5rem;
    }
    .input-focus-style {
      transition: all 0.2s ease;
    }
    .input-focus-style:focus {
      border-color: #C5A059;
      box-shadow: 0 0 0 3px rgba(197,160,89,0.25);
      outline: none;
    }
    .btn-primary {
      background-color: #001744;
      color: white;
      transition: all 0.25s;
    }
    .btn-primary:hover {
      background-color: #C5A059;
      color: #001744;
    }
    .step-indicator .active {
      background-color: #C5A059;
      border-color: #C5A059;
      color: white;
    }
    .status-screen {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
    }
    /* 审核动画 */
    .spinner {
      border-top-color: #C5A059;
      border-right-color: #C5A059;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-gray-800 antialiased">

  <!-- 头部导航 (简约版) -->
  <header class="bg-white/90 backdrop-blur-sm border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
      <div class="flex items-center cursor-pointer" onclick="window.location.href='#'">
        <img class="h-12 w-auto" src="https://xswl-uqewhjj.cdn.7caiyun.com/ChatGPT%20Image%202026%E5%B9%B45%E6%9C%886%E6%97%A5%2019_23_24.png" alt="威斯特礼Logo">
      </div>
      <a href="#" class="hidden sm:flex items-center text-primary hover:text-gold transition font-medium text-sm">
        <i class="fas fa-arrow-left mr-2"></i>返回首页
      </a>
      <div class="sm:hidden">
        <i class="fas fa-bars text-primary text-xl"></i>
      </div>
    </div>
  </header>

  <!-- 主内容区域：根据状态切换 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 min-h-screen">
    
    <!-- ========= 状态1：填写表单 (默认显示) ========= -->
    <div id="formSection" class="transition-all duration-500">
      <div class="text-center mb-10" data-aos="fade-down">
        <h1 class="text-3xl md:text-4xl font-serif font-bold text-primary tracking-wide">入学申请表</h1>
        <div class="gold-bottom-line"></div>
        <p class="text-gray-500 font-light">威斯特礼国际学院（重庆校区）· 2026学年招生</p>
      </div>

      <!-- 步骤提示 -->
      <div class="flex justify-center items-center space-x-4 mb-10 step-indicator text-sm font-medium">
        <span class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center active">1</span>
        <span class="text-primary">填写信息</span>
        <span class="text-gray-300">―</span>
        <span class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center">2</span>
        <span class="text-gray-400">审核通知</span>
      </div>

      <div class="bg-white rounded-2xl card-shadow p-6 md:p-10">
        <form id="admissionForm" class="space-y-7">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">学生姓名 <span class="text-red-500">*</span></label>
              <input type="text" id="studentName" required placeholder="中文或英文名" class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style">
            </div>
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">性别 <span class="text-red-500">*</span></label>
              <select id="gender" required class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style bg-white">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">出生日期 <span class="text-red-500">*</span></label>
              <input type="date" id="birthdate" required class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style">
            </div>
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">申请年级 <span class="text-red-500">*</span></label>
              <select id="grade" required class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style bg-white">
                <option value="">请选择年级</option>
                <option value="幼儿园">幼儿园 (托/小/中/大)</option>
                <option value="小学1-6年级">小学 1-6 年级</option>
                <option value="初中7-9年级">初中 7-9 年级</option>
                <option value="高中10-12年级">高中 10-12 年级</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-primary mb-2">家长/监护人姓名 <span class="text-red-500">*</span></label>
              <input type="text" id="parentName" required placeholder="姓名" class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style">
            </div>
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">联系电话 <span class="text-red-500">*</span></label>
              <input type="tel" id="phone" required placeholder="手机号码" class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style">
            </div>
            <div>
              <label class="block text-sm font-semibold text-primary mb-2">电子邮箱</label>
              <input type="email" id="email" placeholder="example@westley.cn" class="w-full px-4 py-3 border border-gray-200 rounded-lg input-focus-style">
            </div>
          </div>

          <!-- 学费标准速览卡片 -->
          <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 mt-4">
            <h4 class="flex items-center text-primary font-bold text-sm mb-3">
              <i class="fas fa-yen-sign text-gold mr-2"></i>2026 学年学费标准 (单位：元/学年)
            </h4>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs md:text-sm text-gray-700">
              <div><span class="font-semibold">幼儿园：</span>7,800</div>
              <div><span class="font-semibold">小学1-6：</span>8,200</div>
              <div><span class="font-semibold">初中7-9：</span>8,600</div>
              <div><span class="font-semibold">高中10-12：</span>8,900</div>
            </div>
            <div class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-500 flex flex-wrap gap-x-4 gap-y-1">
              <span>📌 报名费200元</span>
              <span>👔 校服980元</span>
              <span>🚌 校车1,800元/年</span>
              <span>🏠 住宿2,600元/年</span>
              <span>🍽️ 餐费2,200元/年</span>
            </div>
          </div>

          <div class="flex items-start space-x-3 mt-2">
            <input type="checkbox" id="agree" required class="mt-1 accent-gold w-4 h-4">
            <label for="agree" class="text-sm text-gray-600">我已知晓学费及杂费标准，并确认所填信息真实有效。</label>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-4 bg-primary text-white font-bold tracking-widest rounded-lg hover:bg-gold hover:text-primary transition-all duration-300 flex items-center justify-center shadow-md">
            <i class="fas fa-paper-plane mr-2"></i> 提交申请
          </button>
        </form>
        <p class="text-xs text-gray-400 text-center mt-4">提交后系统将自动审核，请耐心等待</p>
      </div>
    </div>

    <!-- ========= 状态2：审核中 / 通过 结果屏幕 ========= -->
    <div id="resultSection" class="hidden transition-all duration-700">
      <div class="bg-white rounded-2xl card-shadow p-8 md:p-12 text-center max-w-lg mx-auto">
        
        <!-- 动态内容区域 -->
        <div id="dynamicStatus">
          <!-- JS动态填充 -->
        </div>
        
        <!-- 返回按钮 (审核通过后显示) -->
        <div id="backHomeBtn" class="hidden mt-8">
          <a href="#" class="inline-block bg-primary text-white px-8 py-3 rounded-full font-medium hover:bg-gold hover:text-primary transition">
            <i class="fas fa-home mr-2"></i>返回主页
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部简版 -->
  <footer class="bg-primary text-gray-300 py-6 text-center text-xs border-t-4 border-gold mt-12">
    <p>© 2026 威斯特礼国际学院 · 重庆校区 | 渝ICP备2023000437号</p>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, offset: 80 });

    // 获取DOM元素
    const formSection = document.getElementById('formSection');
    const resultSection = document.getElementById('resultSection');
    const dynamicStatus = document.getElementById('dynamicStatus');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const admissionForm = document.getElementById('admissionForm');

    // 生成随机录取号 (如 WIC-CQ-2026-XXXX)
    function generateAdmissionNumber() {
      const randomPart = Math.floor(1000 + Math.random() * 9000); // 四位数字
      return `WIC-CQ-2026-${randomPart}`;
    }

    // 显示审核中界面
    function showReviewingStatus() {
      formSection.classList.add('hidden');
      resultSection.classList.remove('hidden');
      backHomeBtn.classList.add('hidden');
      
      dynamicStatus.innerHTML = `
        <div class="flex flex-col items-center justify-center space-y-6">
          <div class="w-20 h-20 border-4 border-gray-200 rounded-full flex items-center justify-center spinner" style="border-top-color: #C5A059; border-right-color: #C5A059;"></div>
          <h2 class="text-2xl font-serif font-bold text-primary">审核中，请耐心等待</h2>
          <p class="text-gray-500">系统正在验证您的申请信息...</p>
          <div class="flex space-x-2 mt-4">
            <span class="w-3 h-3 bg-gold rounded-full animate-bounce" style="animation-delay:0s"></span>
            <span class="w-3 h-3 bg-gold rounded-full animate-bounce" style="animation-delay:0.2s"></span>
            <span class="w-3 h-3 bg-gold rounded-full animate-bounce" style="animation-delay:0.4s"></span>
          </div>
        </div>
      `;
    }

    // 显示录取通过界面
    function showApprovedStatus(admissionNumber) {
      dynamicStatus.innerHTML = `
        <div class="space-y-5">
          <div class="text-5xl text-green-600 mb-3"><i class="fas fa-check-circle"></i></div>
          <h2 class="text-2xl font-serif font-bold text-primary">审核通过 · 你已被录取！</h2>
          <div class="bg-yellow-50 border border-gold rounded-xl p-5 mt-4">
            <p class="text-sm text-gray-600 mb-1">录取编号</p>
            <p class="text-2xl font-bold text-primary tracking-widest font-mono">${admissionNumber}</p>
            <p class="text-xs text-red-500 mt-3 flex items-center justify-center">
              <i class="fas fa-camera mr-1"></i> 请截图保存此页面，前往学校报到
            </p>
          </div>
          <div class="text-left bg-gray-50 p-4 rounded-lg text-sm text-gray-700 mt-4">
            <p class="font-semibold text-primary mb-2">📋 报到须知</p>
            <ul class="space-y-1 list-disc list-inside">
              <li>携带录取编号截图及户口本复印件</li>
              <li>现场缴纳报名费200元（仅支持扫码）</li>
              <li>地址：重庆市渝北区两江新区两江大道</li>
            </ul>
          </div>
        </div>
      `;
      backHomeBtn.classList.remove('hidden');
    }

    // 表单提交处理
    admissionForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // 简易表单验证 (HTML5 required已处理大部分)
      const agreeCheck = document.getElementById('agree');
      if (!agreeCheck.checked) {
        alert('请勾选同意条款');
        return;
      }
      
      // 1. 切换到审核中状态
      showReviewingStatus();
      
      // 2. 模拟3秒后审核通过
      setTimeout(() => {
        const admissionNum = generateAdmissionNumber();
        showApprovedStatus(admissionNum);
      }, 3000);
    });

    // 可选：如果用户点击返回主页 (目前链接为#)
    document.querySelectorAll('a[href="#"]').forEach(link => {
      link.addEventListener('click', (e) => {
        if(link.textContent.includes('返回首页') || link.textContent.includes('返回主页')) {
          e.preventDefault();
          // 重置到表单页 (模拟返回)
          formSection.classList.remove('hidden');
          resultSection.classList.add('hidden');
          admissionForm.reset();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  </script>
</body>
</html>
